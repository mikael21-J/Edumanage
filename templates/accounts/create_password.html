{% extends 'base.html' %} {% block title %}Créer mon mot de passe{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-shell">
    <div class="auth-intro">
      <div class="auth-mark"><i class="fa-solid fa-shield-halved"></i></div>
      <small>ÉTAPE 2</small>
      <h1>EduManage</h1>
      <p class="mb-0">Sécurisez votre accès personnel.</p>
    </div>
    <div class="auth-form">
      <h2>Créer mon mot de passe</h2>
      <p class="text-center mb-4">Six caractères minimum.</p>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label" for="password">Mot de passe</label>
          <div class="auth-input-wrap">
            <i class="auth-icon fa-solid fa-lock"></i
            ><input
              id="password"
              type="password"
              name="password"
              class="form-control"
              required
              minlength="6"
            />
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password_confirm"
            >Confirmer le mot de passe</label
          >
          <div class="auth-input-wrap">
            <i class="auth-icon fa-solid fa-lock"></i
            ><input
              id="password_confirm"
              type="password"
              name="password_confirm"
              class="form-control"
              required
              minlength="6"
            />
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100">
          Valider mon compte <i class="fa-solid fa-arrow-right ms-2"></i>
        </button>
      </form>
    </div>
    <div class="auth-footer">
      Vous avez déjà un compte ?
      <a href="{% url 'login' %}" class="auth-link">Se connecter</a>
    </div>
  </div>
</div>
{% endblock %}
